{% extends 'base.html' %}
{% load static %}

{% block title %}Update Blood Request - Bleed To Save{% endblock %}

{% block content %}
<div class="container py-5 form-gap">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8">
            <div class="card shadow-sm border-0 wow animate__animated animate__fadeInUp" style="border-radius: 12px; overflow: hidden;">
                <div class="card-header bg-crimson text-white py-3">
                    <h4 class="mb-0 font-weight-bold" style="font-family: 'Poppins', sans-serif;"><i class="fas fa-edit mr-2"></i>Update Blood Request</h4>
                </div>
                <div class="card-body p-4" style="font-family: 'Inter', sans-serif;">
                    <form method="post" action="{% url 'update_blood_request' request_obj.pk %}">
                        {% csrf_token %}
                        
                        <div class="form-group mb-3">
                            <label class="form-label text-danger"><i class="fas fa-user mr-2"></i>Patient Name</label>
                            <input type="text" class="form-control" name="patient_name" id="patient_name" 
                                   value="{{ request_obj.patient_name }}" placeholder="Enter patient's name" required>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label class="form-label text-danger"><i class="fas fa-phone mr-2"></i>Patient's Relative Mobile Number</label>
                            <input type="tel" class="form-control" name="mobile" id="mobile" 
                                   value="{{ request_obj.mobile }}" placeholder="Enter mobile number" required>
                            <small class="form-text text-muted">Format: +880123456789</small>
                        </div>
                        
                        <div class="row">
                            <div class="col-12 col-md-6">
                                <div class="form-group mb-3">
                                    <label class="form-label text-danger"><i class="fas fa-tint mr-2"></i>Blood Group</label>
                                    <!-- Blood Group is non-editable in typical workflow, but if allowed: -->
                                    <select name="blood_group" id="blood_group" class="form-control" required disabled>
                                        {% for code, name in blood_groups %}
                                        <option value="{{ code }}" {% if request_obj.blood_group == code %}selected{% endif %}>{{ name }}</option>
                                        {% endfor %}
                                    </select>
                                    <small class="text-muted">Blood group cannot be changed after creation.</small>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="form-group mb-3">
                                    <label class="form-label text-danger"><i class="fas fa-syringe mr-2"></i>Units Required</label>
                                    <input type="number" class="form-control" name="units_required" id="units_required" 
                                           value="{{ request_obj.units_required }}" placeholder="Enter units required" min="1" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label class="form-label text-danger"><i class="fas fa-venus-mars mr-2"></i>Gender</label>
                            <div class="d-flex">
                                <div class="form-check mr-4">
                                    <input type="radio" class="form-check-input" id="male" name="gender" value="male" 
                                           {% if request_obj.gender == 'male' %}checked{% endif %} required>
                                    <label class="form-check-label text-charcoal" for="male">Male</label>
                                </div>
                                <div class="form-check">
                                    <input type="radio" class="form-check-input" id="female" name="gender" value="female"
                                           {% if request_obj.gender == 'female' %}checked{% endif %}>
                                    <label class="form-check-label text-charcoal" for="female">Female</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label class="form-label text-danger"><i class="fas fa-exclamation-circle mr-2"></i>Urgency</label>
                            <select name="urgency" id="urgency" class="form-control" required>
                                {% for code, name in urgency_choices %}
                                <option value="{{ code }}" {% if request_obj.urgency == code %}selected{% endif %}>{{ name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label class="form-label text-danger"><i class="fas fa-info-circle mr-2"></i>Purpose</label>
                            <input type="text" class="form-control" name="purpose" id="purpose" 
                                   value="{{ request_obj.purpose }}" placeholder="Enter purpose of blood requirement" required>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label class="form-label text-danger"><i class="fas fa-hospital mr-2"></i>Hospital</label>
                            <input type="text" class="form-control" name="hospital" id="hospital" 
                                   value="{{ request_obj.hospital }}" placeholder="Enter hospital name" required>
                        </div>
                        
                        <div class="form-group mb-4">
                            <label class="form-label text-danger"><i class="fas fa-calendar-alt mr-2"></i>Needed By</label>
                            <input type="datetime-local" class="form-control" name="needed_by" id="needed_by" 
                                   value="{{ needed_by_formatted }}" required>
                        </div>
                        
                        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
                            <button type="submit" class="btn btn-bleed w-100 w-md-auto font-weight-bold" style="border-radius: 8px;">
                                <i class="fas fa-save mr-2"></i>Save Changes
                            </button>
                            <a href="{% url 'blood_request_list' %}" class="btn btn-secondary slide-btn w-100 w-md-auto font-weight-bold" style="border-radius: 8px;">
                                <i class="fas fa-times mr-2"></i>Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.1) !important;
}
.bg-crimson {
    background-color: var(--primary-crimson) !important;
}
.text-danger {
    color: var(--primary-crimson) !important;
}
.text-charcoal {
    color: var(--charcoal-gray);
}
.form-control {
    border: 1px solid rgba(192, 57, 43, 0.2);
    transition: all 0.3s ease;
}
.form-control:focus {
    border-color: var(--primary-crimson);
    box-shadow: 0 0 0 0.2rem rgba(192, 57, 43, 0.25);
}
.form-label {
    font-weight: 600;
    margin-bottom: 0.5rem;
}
.form-check-input:checked {
    background-color: var(--primary-crimson);
    border-color: var(--primary-crimson);
}
.form-check-input:focus {
    border-color: var(--primary-crimson);
    box-shadow: 0 0 0 0.2rem rgba(192, 57, 43, 0.25);
}
</style>
{% endblock %}
