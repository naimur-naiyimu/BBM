{% extends 'base.html' %}
{% load static %}

{% block title %}Registration{% endblock %}

{% block content %}

    <!-- Register -->
    <h1 class="display-4 section-heading form-gap mb-5 text-center">Registration Form</h1>
    <section id="login-form" class="container">
        <div class="col-lg-5 col-md-7 login-form card">
            <div class="card-body my-4">
                    <form method="post" class="mb-4" action="{% url 'register' %}">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="first_name">First Name</label>
                            <input type="text" class="form-control" name="first_name" id="first_name" placeholder="First Name" required>
                        </div>
                        <div class="form-group">
                            <label for="last_name">Last Name</label>
                            <input type="text" class="form-control" name="last_name" id="last_name" placeholder="Last Name" required>
                        </div>
                        <div class="form-group">
                            <label for="mobile">Mobile Number</label>
                            <input type="tel" class="form-control" name="mobile" id="mobile"  placeholder="Mobile Number" required>
                            <small class="mt-2 form-text text-muted">Format: +880123456789</small>
                        </div>
                        <div class="form-group">
                            <label for="mobile2">Alternative Mobile Number</label>
                            <input type="tel" class="form-control" name="mobile2" id="mobile2" placeholder="Alternative Mobile Number">
                            <small class="mt-2 form-text text-muted">Format: +880123456789</small>
                        </div>
                        <div class="form-group">
                            <label for="blood_group">Blood Group</label>
                            <select name="blood_group" id="blood_group" class="form-control" required>
                                <option value="" selected disabled>Blood Group</option>
                                {% for code, name in blood_groups %}
                                <option value="{{ code }}">{{ name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender</label><br>
                            <label for="male" class="radio-input mr-3">Male
                                <input type="radio" checked="checked" id="male" name="gender" value="male" required>
                                <span class="checkmark"></span>
                            </label>
                            <label for="female" class="radio-input  mr-3">Female
                                <input type="radio" id="female" name="gender" value="female">
                                <span class="checkmark"></span>
                            </label>
                        </div>
                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number" class="form-control" name="age" id="age" placeholder="Age" min="16" max="65" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" name="email" id="email" placeholder="Email" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" class="form-control" name="password" id="password" placeholder="Password" minlength="8" required>
                        </div>
                        <button type="submit" class="mt-3 btn btn-lg btn-primary slide-btn">Register</button>
                    </form>
                    <p class="d-inline">If you have account then </p><span class="a-underline"><a
                        href="{% url 'login'%}">Login now</a></span>
                </div>
            </div>
        </div>

    </section>
{% endblock %}
