{% extends 'base.html' %}
{% load static %}

{% block title %}Confirm Delete - Bleed To Save{% endblock %}

{% block content %}
<div class="container py-5 form-gap">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card shadow border-0 wow animate__animated animate__zoomIn" style="border-radius: 12px; overflow: hidden;">
                <div class="card-header bg-crimson text-white py-3 text-center">
                    <h4 class="mb-0 font-weight-bold" style="font-family: 'Poppins', sans-serif;"><i class="fas fa-exclamation-triangle mr-2"></i>Confirm Delete</h4>
                </div>
                <div class="card-body p-4 text-center" style="font-family: 'Inter', sans-serif;">
                    <p class="lead mb-4 text-charcoal">Are you sure you want to delete this record?</p>
                    <p class="text-muted small mb-4">This action is permanent and cannot be undone.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <button type="submit" class="btn btn-danger font-weight-bold px-4 py-2 mr-3" style="border-radius: 8px; background-color: #C0392B;">
                                <i class="fas fa-trash-alt mr-2"></i>Yes, Delete
                            </button>
                            <a href="javascript:history.back()" class="btn btn-secondary font-weight-bold px-4 py-2" style="border-radius: 8px;">
                                <i class="fas fa-times mr-2"></i>Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.bg-crimson {
    background-color: var(--primary-crimson) !important;
}
.text-charcoal {
    color: var(--charcoal-gray);
}
</style>
{% endblock %}
