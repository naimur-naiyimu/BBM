{% extends 'base.html' %}
{% load static %}

{% block title %}Blood Request{% endblock %}

{% block content %}
    <!-- Blood Request Info -->
    <h1 class="display-4 section-heading form-gap mb-5 text-center">Blood Request</h1>
    <section id="login-form" class="container">
        <div class="col-lg-5 col-md-7 mb-5 login-form card">
            <div class="card-body my-4">
                <div class="container">
                    <form method="post" action="{% url 'blood-request-create' %}">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="first_name">Patient Name</label>
                            <input type="text" class="form-control" name="patient_name" id="patient_name" placeholder="Patient Name" required>
                        </div>
                        <div class="form-group">
                            <label for="mobile">Patient's Relative Mobile Number</label>
                            <input type="tel" class="form-control" name="mobile" id="mobile"  placeholder="Mobile Number" required>
                            <small class="mt-2 form-text text-muted">Format: +880123456789</small>
                        </div>
                        <div class="form-group">
                            <label for="blood_group">Blood Group</label>
                            <select name="blood_group" id="blood_group" class="form-control" required>
                                <option value="" selected disabled>Blood Group</option>
                                {% for code, name in blood_groups %}
                                <option value="{{ code }}">{{ name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="units_required">Units Required</label>
                            <input type="number" class="form-control" name="units_required" id="units_required" placeholder="Units Required" min="1"  required>
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender</label><br>
                            <label for="male" class="radio-input mr-3">Male
                                <input type="radio" checked="checked" id="male" name="gender" value="male" required>
                                <span class="checkmark"></span>
                            </label>
                            <label for="female" class="radio-input  mr-3">Female
                                <input type="radio" id="female" name="gender" value="female">
                                <span class="checkmark"></span>
                            </label>
                        </div>
                        <div class="form-group">
                            <label for="urgency">Urgency</label>
                            <select name="urgency" id="blood_group" class="form-control" required>
                                <option value="" selected disabled>Urgency</option>
                                {% for code, name in urgency_choices %}
                                <option value="{{ code }}">{{ name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="purpose">Purpose</label>
                            <input type="text" class="form-control" name="purpose" id="purpose" placeholder="Purpose" required>
                        </div>
                        <div class="form-group">
                            <label for="hospital">Hospital</label>
                            <input type="text" class="form-control" name="hospital" id="hospital" placeholder="hospital" required>
                        </div>
                        <div class="form-group">
                            <label for="needed_by">Needed By</label>
                            <input type="datetime-local" class="form-control" name="needed_by" id="needed_by" placeholder="Needed By" required>
                        </div>
                        <button type="submit" class="mt-3 btn btn-lg btn-primary slide-btn">Request</button>
                    </form>
                </div>
            </div>
        </div>
    <section>

{% endblock %}
